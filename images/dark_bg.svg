<svg
  version="1.1"
  baseProfile="full"
  width="100%" height="100%"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1400 800"
  style="background-color: #0d1117;"
>
  <circle cx="200" cy="400" r="350" fill="none" stroke="rgba(56, 139, 253, 0.05)" stroke-width="1" stroke-dasharray="10 10">
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="120s" type="rotate" from="0 200 400" to="360 200 400" repeatCount="indefinite" />
  </circle>

  <rect x="1150" y="200" rx="10" ry="10" width="180" height="240" stroke="rgba(63, 185, 80, 0.1)" fill="none" stroke-width="1.5">
    <animateMotion path="M 0 0 L 0 -30 L 0 0" dur="15s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="8s" repeatCount="indefinite" />
  </rect>

  <circle cx="400" cy="150" r="3" fill="#388bfd">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite" />
    <animateMotion path="M 0 0 L 10 10 Z" dur="20s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="900" cy="500" r="2" fill="#79c0ff">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="6s" repeatCount="indefinite" />
    <animateMotion path="M 0 0 L -15 5 Z" dur="25s" repeatCount="indefinite" />
  </circle>

  <line x1="100" y1="700" x2="400" y2="700" stroke="rgba(139, 148, 158, 0.1)" stroke-width="1">
    <animate attributeName="x2" values="400;1200;400" dur="40s" repeatCount="indefinite" />
  </line>

  <circle cx="1200" cy="100" r="100" fill="rgba(56, 139, 253, 0.03)">
     <animate attributeName="r" values="100;150;100" dur="30s" repeatCount="indefinite" />
  </circle>
</svg>
