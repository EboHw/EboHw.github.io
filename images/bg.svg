<svg
  version="1.1"
  baseProfile="full"
  width="100%" height="100%"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1400 800"
  style="background-color: #f8f9fa;"
>
  <path d="M 50 400 A 300 300 0 0 1 650 400" fill="none" stroke="rgba(26, 115, 232, 0.25)" stroke-width="40" stroke-linecap="round">
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="40s" type="rotate" from="360 350 400" to="0 350 400" repeatCount="indefinite" />
  </path>

  <rect x="1100" y="500" rx="30" ry="30" width="200" height="200" stroke="rgba(129, 201, 149, 0.80)" fill="none" stroke-width="2">
    <animateMotion path="M 0 0 L 0 -40 L 0 0" dur="12s" repeatCount="indefinite" />
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="25s" type="rotate" from="0 1200 600" to="360 1200 600" repeatCount="indefinite" />
  </rect>

  <circle cx="250" cy="150" r="12" fill="#1a73e8" opacity="0.6">
    <animate attributeName="r" values="12;18;12" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="6s" repeatCount="indefinite" />
  </circle>

  <circle cx="800" cy="200" r="4" fill="rgba(0,0,0,0.1)">
    <animateMotion path="M 0 0 L 30 20 L 0 0" dur="15s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="1200" cy="150" r="6" fill="rgba(238, 103, 92, 0.2)">
    <animateMotion path="M 0 0 L -20 30 L 0 0" dur="10s" repeatCount="indefinite" />
  </circle>

  <rect x="650" y="380" width="100" height="2" fill="rgba(0,0,0,0.05)">
    <animate attributeName="width" values="100;300;100" dur="20s" repeatCount="indefinite" />
  </rect>
</svg>
